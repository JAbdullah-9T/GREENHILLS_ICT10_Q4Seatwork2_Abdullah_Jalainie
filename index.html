<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet List</title>
    
    <!-- Style -->
    <link rel="stylesheet" type="text/css" href="style.css">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <style>
        .container {
            max-width: 500px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h3 class="text-center">Student Information</h3>

        <form>
            <label>Name:</label>
            <input type="text" id="name" class="form-control"><br>

            <label>Section:</label>
            <input type="text" id="section" class="form-control"><br>

            <label>Favourite Subject:</label>
            <input type="text" id="fsub" class="form-control"><br>

            <!-- Buttons -->
            <button type="button" class="btn btn-success" py-click="addStudent">
                Add Classmate
            </button>

            <button type="button" class="btn btn-primary" py-click="showStudents">
                Show List
            </button>
        </form>
    </div>

    <div id="output" class="text-center mt-4"></div>

    <!-- Python file -->
    <py-script src="main.py"></py-script>

</body>
</html>
