<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student List</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <style>
        .container {
            max-width: 500px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h3 class="text-center mb-4">Student Information</h3>

        <form onsubmit="return false;">

            <div class="mb-3">
                <label class="form-label">Name:</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Section:</label>
                <input type="text" id="section" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Favourite Subject:</label>
                <input type="text" id="fsub" class="form-control" required>
            </div>

            <div class="d-flex gap-2">
                <button type="button" class="btn btn-success" py-click="addStudent">
                    Add Classmate
                </button>

                <button type="button" class="btn btn-primary" py-click="showStudents">
                    Show List
                </button>
            </div>

        </form>

        <div id="output" class="mt-4"></div>
    </div>

    <!-- Python file -->
    <py-script src="main.py"></py-script>

</body>
</html>
